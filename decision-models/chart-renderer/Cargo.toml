[package]
name = "charts"
version = "0.1.0"
edition = "2024"
publish = false
description = "Draws the results page's graphs with ratatui widgets and writes them as SVG, with text snapshots for review."

[dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = "1"
